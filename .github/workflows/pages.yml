name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/corner-radius-spa-yj030e
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to the gh-pages branch auto-enables GitHub Pages for the
      # repo; the workflow token cannot enable the newer "GitHub Actions"
      # Pages source on its own (that needs repo-admin API access).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
